<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <title>Металлобаза</title>

    <link rel="stylesheet" href="/src/styles/main.css" />
    <script>
      (function(){var t=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme:dark)').matches;if(t==='dark'||(t===null&&d)){document.documentElement.classList.add('dark');}})();
    </script>
    <script>
      (function(){try{var s=JSON.parse(localStorage.getItem('a11y')||'null');if(!s||!s.enabled)return;var h=document.documentElement;h.classList.add('a11y');if(s.fontSize==='large')h.classList.add('a11y-font-large');if(s.fontSize==='xlarge')h.classList.add('a11y-font-xlarge');if(s.scheme)h.classList.add('a11y-scheme-'+s.scheme);}catch(e){}})();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <div id="a11y-images-banner" aria-live="polite">Изображения отключены в режиме для слабовидящих</div>
    <div id="app"></div>
    <div id="app-preloader" style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--color-surface,#fff);transition:opacity .3s ease,background .3s ease;">
      <div style="width:56px;height:56px;border:4px solid rgba(255,196,0,0.25);border-top-color:#FFC400;border-radius:50%;animation:apl-spin 1s linear infinite;"></div>
    </div>
    <style>@keyframes apl-spin{to{transform:rotate(360deg)}}</style>
  </body>
</html>
